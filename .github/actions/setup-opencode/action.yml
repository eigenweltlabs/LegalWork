name: Set up pinned OpenCode
description: Install LegalWork's selected, independently pinned OpenCode engine
inputs:
  archive-directory:
    description: Exact reviewed local derivative archive directory (optional)
    required: false
  cache-directory:
    description: Verified archive cache directory (optional)
    required: false
runs:
  using: composite
  steps:
    - name: Install OpenCode CLI
      shell: bash
      env:
        LEGALWORK_OPENCODE_ARCHIVES: ${{ inputs.archive-directory }}
        LEGALWORK_OPENCODE_SETUP_CACHE: ${{ inputs.cache-directory }}
      run: |
        set -euo pipefail
        node packages/opencode-release/install.mjs \
          --install-root "$RUNNER_TEMP/legalwork-opencode" \
          --cache-directory "${LEGALWORK_OPENCODE_SETUP_CACHE:-$RUNNER_TEMP/legalwork-opencode-cache}" \
          --github-actions
