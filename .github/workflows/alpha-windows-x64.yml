name: Recover Windows alpha 46

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: recover-windows-alpha-46
  cancel-in-progress: false

jobs:
  recover:
    name: Validate and publish saved installer (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            manifest: latest.yml
          - os: windows-11-arm
            arch: arm64
            manifest: latest-arm64.yml
    env:
      ALPHA_ARCH: ${{ matrix.arch }}
      UPDATER_MANIFEST: ${{ matrix.manifest }}
      SOURCE_SHA: 1cd3135bf6ab1d1650aed64d110d0e56b98c5139
      ALPHA_VERSION: 0.2.8-alpha.46.g1cd3135
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - name: Install only release-check dependencies
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'release-check'
          New-Item -ItemType Directory -Force $tools | Out-Null
          Set-Content (Join-Path $tools 'package.json') '{"private":true}'
          pnpm --dir $tools add --ignore-scripts electron-builder@26.16.1 typescript@5.9.3 yaml@2.8.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NODE_PATH=$tools/node_modules" >> $env:GITHUB_ENV
      - name: Test archive paths on Windows
        run: node --test apps/desktop/electron/packaged-server-deps.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-legalwork-windows-${{ matrix.arch }}-38701131551-1
          run-id: 38701131551
          github-token: ${{ github.token }}
          path: recovered
      - name: Extract the original installer
        run: node scripts/release/recover-alpha-46.cjs extract
      - name: Verify original packaged app startup
        timeout-minutes: 3
        shell: pwsh
        run: |
          node apps/desktop/scripts/packaged-startup-regression.mjs recovered/app/LegalWork.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regenerate updater metadata for the unchanged installer
        run: node scripts/release/recover-alpha-46.cjs metadata
      - name: Publish validated alpha and updater pointer
        shell: bash
        run: |
          set -euo pipefail
          tag="alpha-windows-${ALPHA_ARCH}-v0.2.8-alpha.46-1cd3135"
          printf '%s\n\n%s\n' "Windows ${ALPHA_ARCH} alpha from ${SOURCE_SHA}." "Original installer from build 38701131551, validated with the corrected Windows archive check and a real packaged-app startup test." > recovered/release-notes.txt
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "LegalWork Alpha ${ALPHA_VERSION} (Windows ${ALPHA_ARCH})" --notes-file recovered/release-notes.txt --target "$SOURCE_SHA" --prerelease
          fi
          gh release upload "$tag" recovered/*.exe recovered/*.blockmap "recovered/$UPDATER_MANIFEST" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload alpha-windows-latest "recovered/pointer/$UPDATER_MANIFEST" --repo "$GITHUB_REPOSITORY" --clobber
