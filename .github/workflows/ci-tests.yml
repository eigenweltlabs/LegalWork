name: LegalWork Tests

on:
  pull_request:
    branches:
      - dev
      - codex/projects-akte-workspace
  workflow_dispatch:
    inputs:
      mac_signing_acceptance:
        description: Only compile, production-sign and execute the three Mac engine targets without publishing
        type: boolean
        default: false
      package_desktop:
        description: Build and execute desktop and reviewed engine on all six shipped OS/CPU configurations
        type: boolean
        default: false
      unit_acceptance:
        description: Run the full Linux and Mac unit jobs against an exact reused engine; does not validate six-platform packages
        type: boolean
        default: false
      committed_selection:
        description: Test six-platform packages using the published engine pinned in committed selection.json, without a candidate override
        type: boolean
        default: false
      engine_reuse_run_id:
        description: Optional same-repository producer run ID (requires independent manifest SHA256)
        type: string
        default: ''
      engine_reuse_manifest_sha256:
        description: Independent SHA256 of that producer's complete twelve-target engine manifest
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: legalwork-tests-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.mac_signing_acceptance && '-mac-signing' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.package_desktop && !inputs.mac_signing_acceptance && format('-package-{0}', github.run_id) || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.unit_acceptance && !inputs.package_desktop && !inputs.mac_signing_acceptance && format('-unit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  signing-inputs:
    if: github.event_name == 'workflow_dispatch' && inputs.mac_signing_acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Reject contradictory manual modes
        env:
          PACKAGE_DESKTOP: ${{ inputs.package_desktop }}
          UNIT_ACCEPTANCE: ${{ inputs.unit_acceptance }}
          COMMITTED_SELECTION: ${{ inputs.committed_selection }}
        run: |
          if [ "$PACKAGE_DESKTOP" = true ] || [ "$UNIT_ACCEPTANCE" = true ] || [ "$COMMITTED_SELECTION" = true ]; then
            echo 'mac_signing_acceptance, package_desktop and unit_acceptance are mutually exclusive.' >&2
            exit 1
          fi
  unit-inputs:
    if: github.event_name == 'workflow_dispatch' && inputs.unit_acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Require an exclusive focused mode and exact engine reuse
        env:
          PACKAGE_DESKTOP: ${{ inputs.package_desktop }}
          MAC_SIGNING_ACCEPTANCE: ${{ inputs.mac_signing_acceptance }}
          COMMITTED_SELECTION: ${{ inputs.committed_selection }}
          ENGINE_REUSE_RUN_ID: ${{ inputs.engine_reuse_run_id }}
          ENGINE_REUSE_MANIFEST_SHA256: ${{ inputs.engine_reuse_manifest_sha256 }}
        run: |
          if [ "$PACKAGE_DESKTOP" = true ] || [ "$MAC_SIGNING_ACCEPTANCE" = true ] || [ "$COMMITTED_SELECTION" = true ]; then
            echo 'unit_acceptance cannot be combined with package or signing acceptance.' >&2
            exit 1
          fi
          if [ -z "$ENGINE_REUSE_RUN_ID" ] || [ -z "$ENGINE_REUSE_MANIFEST_SHA256" ]; then
            echo 'unit_acceptance requires an engine producer run and independent manifest SHA256.' >&2
            exit 1
          fi
  committed-inputs:
    if: github.event_name == 'workflow_dispatch' && inputs.committed_selection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Require the committed published selection without candidate inputs
        env:
          PACKAGE_DESKTOP: ${{ inputs.package_desktop }}
          MAC_SIGNING_ACCEPTANCE: ${{ inputs.mac_signing_acceptance }}
          UNIT_ACCEPTANCE: ${{ inputs.unit_acceptance }}
          ENGINE_REUSE_RUN_ID: ${{ inputs.engine_reuse_run_id }}
          ENGINE_REUSE_MANIFEST_SHA256: ${{ inputs.engine_reuse_manifest_sha256 }}
        run: |
          if [ "$PACKAGE_DESKTOP" != true ] || [ "$MAC_SIGNING_ACCEPTANCE" = true ] || [ "$UNIT_ACCEPTANCE" = true ] || [ -n "$ENGINE_REUSE_RUN_ID" ] || [ -n "$ENGINE_REUSE_MANIFEST_SHA256" ]; then
            echo 'committed_selection requires package_desktop only, without candidate reuse inputs.' >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          import { verifyDerivativeDistributionContent } from './packages/opencode-release/derivative.mjs';
          const text = await readFile('packages/opencode-release/selection.json', 'utf8');
          const selection = JSON.parse(text);
          assert.equal(selection.kind, 'derivative', 'A published derivative must be committed before this acceptance mode');
          assert.equal(selection.schemaVersion, 1);
          const distribution = await verifyDerivativeDistributionContent(selection);
          assert.equal(selection.version, distribution.version);
          assert.equal(selection.baseVersion, distribution.baseVersion);
          const url = new URL(selection.downloadBaseUrl);
          assert.ok(url.protocol === 'https:' && !url.username && !url.password && !url.search && !url.hash && url.pathname.endsWith('/'), 'The committed selection requires a plain public HTTPS download directory');
          console.log(JSON.stringify({ selectionSha256: createHash('sha256').update(text).digest('hex'), manifestSha256: selection.manifestSha256, version: selection.version, downloadBaseUrl: selection.downloadBaseUrl }));
          NODE
  mac-signing-acceptance:
    needs: signing-inputs
    if: github.event_name == 'workflow_dispatch' && inputs.mac_signing_acceptance && !inputs.unit_acceptance && !inputs.committed_selection
    uses: ./.github/workflows/mac-engine-signing-acceptance.yml
    secrets:
      APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
      APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
  sandbox-changes:
    if: github.event_name != 'workflow_dispatch' || (!inputs.mac_signing_acceptance && !inputs.unit_acceptance)
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Check sandbox inputs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/sandbox-changes.mjs

  sandbox-runtime:
    needs: sandbox-changes
    # Maintainers can skip expensive runtime checks for an individual PR.
    # Push, manual and release validation remain unaffected by PR labels.
    if: >-
      needs.sandbox-changes.outputs.required == 'true' &&
      !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'skip-sandbox-tests'))
    uses: ./.github/workflows/sandbox-runtime.yml
  opencode-derivative:
    if: >-
      github.event_name == 'workflow_dispatch' && !inputs.mac_signing_acceptance && !inputs.committed_selection &&
      ((inputs.package_desktop && !inputs.unit_acceptance) ||
      (inputs.unit_acceptance && !inputs.package_desktop && inputs.engine_reuse_run_id != '' && inputs.engine_reuse_manifest_sha256 != ''))
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-opencode-derivative.yml
    with:
      reuse-run-id: ${{ inputs.engine_reuse_run_id }}
      reuse-manifest-sha256: ${{ inputs.engine_reuse_manifest_sha256 }}
  desktop-packaging:
    # Manual package diagnostics may exercise a built runtime after a sandbox
    # assertion fails. The failed sandbox workflow still keeps the run red.
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      inputs.package_desktop && !inputs.mac_signing_acceptance && !inputs.unit_acceptance &&
      (!inputs.committed_selection || needs.committed-inputs.result == 'success') &&
      (needs.opencode-derivative.result == 'success' ||
      (inputs.committed_selection && needs.opencode-derivative.result == 'skipped' && needs.committed-inputs.result == 'success')) &&
      (needs.sandbox-runtime.result == 'success' || needs.sandbox-runtime.result == 'failure')
    needs: [sandbox-runtime, opencode-derivative, committed-inputs]
    uses: ./.github/workflows/ci-desktop-packaging.yml
    with:
      derivative-manifest-sha256: ${{ needs.opencode-derivative.outputs.manifest-sha256 }}
  windows-meetings:
    if: github.event_name != 'workflow_dispatch' || (!inputs.mac_signing_acceptance && !inputs.unit_acceptance)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Test Windows meeting detection and native metadata helper
        run: node --test apps/desktop/electron/windows-meeting-probe.test.mjs apps/desktop/electron/meeting-monitor.test.mjs

  windows-drafts:
    if: github.event_name != 'workflow_dispatch' || (!inputs.mac_signing_acceptance && !inputs.unit_acceptance)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test portable drafts
        run: pnpm test:drafts
      - name: Test Windows Outlook handoff
        run: node --test apps/desktop/electron/mail-draft.test.mjs
      - name: Test packaged server archive imports on Windows
        run: node --test apps/desktop/electron/packaged-server-deps.test.mjs

  legalwork-tests:
    needs: [opencode-derivative, committed-inputs]
    if: always() && !(github.event_name == 'workflow_dispatch' && inputs.mac_signing_acceptance) && (!(github.event_name == 'workflow_dispatch' && inputs.committed_selection) || needs.committed-inputs.result == 'success') && (needs.opencode-derivative.result == 'success' || (needs.opencode-derivative.result == 'skipped' && !(github.event_name == 'workflow_dispatch' && inputs.unit_acceptance)))
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/download-artifact@v4
        if: needs.opencode-derivative.result == 'success'
        with:
          name: opencode-derivative-ci
          path: ${{ runner.temp }}/opencode-derivative
      - name: Select the reviewed acceptance engine
        if: needs.opencode-derivative.result == 'success'
        env:
          MANIFEST_SHA256: ${{ needs.opencode-derivative.outputs.manifest-sha256 }}
        run: node scripts/ci/select-opencode-derivative.mjs "$RUNNER_TEMP/opencode-derivative/derivative-release.json" "$MANIFEST_SHA256"
      - uses: ./.github/actions/setup-opencode
        with:
          archive-directory: ${{ needs.opencode-derivative.result == 'success' && format('{0}/opencode-derivative/archives', runner.temp) || '' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare checksum-pinned Node for worker tests
        run: node apps/desktop/scripts/prepare-node-runtime.mjs

      - name: Typecheck app
        if: runner.os == 'Linux'
        run: pnpm --filter @legalwork/app typecheck

      - name: Build server and native plugins
        run: pnpm --filter legalwork-server build

      - name: Run app unit tests
        run: pnpm --filter @legalwork/app test

      - name: Verify recorder capture and dictation
        run: |
          pnpm --filter @legalwork/app test:recorder-capture
          pnpm --filter @legalwork/app test:dictation

      - name: Run server unit tests
        run: pnpm --filter legalwork-server test

      - name: Verify released engine authentication, native plugin modules, and shutdown
        run: |
          node --test apps/desktop/electron/opencode-release.test.mjs
          bun test --preload ./apps/server/test-preload.ts apps/server/src/managed-opencode.released.test.ts

      - name: Verify scheduling and file search with the shipped engine
        run: |
          pnpm --filter legalwork-server build
          LEGALWORK_TEST_OPENCODE_BIN="$(command -v opencode)" bun test --preload ./apps/server/test-preload.ts --timeout 180000 apps/server/src/scheduled-tasks/engine.test.ts apps/server/src/managed-opencode.search.e2e.test.ts

      - name: Verify built draft routes load in Node
        run: pnpm test:drafts:build

      - name: Verify Node development-server history and restart
        run: node --test apps/server/scripts/dev-node.test.mjs

      - name: Verify whole-agent prompt cache contract
        env:
          LEGALWORK_CACHE_CAPTURE: ${{ runner.temp }}/prompt-cache-capture.json
        run: LEGALWORK_TEST_OPENCODE_BIN="$(command -v opencode)" bun test --preload ./apps/server/test-preload.ts apps/server/scripts/prompt-cache-engine.test.ts

      - name: Upload synthetic prompt cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-cache-${{ runner.os }}
          path: ${{ runner.temp }}/prompt-cache-capture.json

      - name: Verify report source evidence checks
        run: |
          python3 -m venv "$RUNNER_TEMP/legalwork-report-tests"
          "$RUNNER_TEMP/legalwork-report-tests/bin/python" -I -S apps/server/resources/agent-sandbox/bootstrap-pip.py
          "$RUNNER_TEMP/legalwork-report-tests/bin/python" -m pip install python-docx==1.2.0
          "$RUNNER_TEMP/legalwork-report-tests/bin/python" apps/server/scripts/test-report-evidence.py
          "$RUNNER_TEMP/legalwork-report-tests/bin/python" apps/server/scripts/test-report-from-reviews.py

      - name: Run desktop unit tests
        run: pnpm --filter @legalwork/desktop test

      - name: Verify HTML preview isolation in Electron
        if: runner.os == 'macOS'
        run: pnpm --filter @legalwork/desktop test:preview-security

      - name: Verify browser batches and project downloads in Electron
        if: runner.os == 'macOS'
        env:
          LEGALWORK_BROWSER_TEST_SCREENSHOT: ${{ runner.temp }}/browser-workflow.png
        run: pnpm --filter @legalwork/desktop test:browser-workflow

      - name: Verify browser network policy in Electron
        if: runner.os == 'macOS'
        run: pnpm --filter @legalwork/desktop test:browser-network

      - name: Upload browser workflow evidence
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: browser-workflow-evidence
          path: ${{ runner.temp }}/browser-workflow.png

      - name: Run release tooling tests
        run: node --test scripts/release/*.test.mjs scripts/ci/*.test.mjs

      - name: Typecheck Electron main against the IPC contract
        run: pnpm --filter @legalwork/desktop typecheck:electron

      - name: Run e2e tests
        run: pnpm --filter @legalwork/app test:e2e

  sandbox-engine:
    needs: sandbox-runtime
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/setup-opencode
      - run: pnpm install --frozen-lockfile
      - name: Prepare checksum-pinned Node for worker tests
        run: node apps/desktop/scripts/prepare-node-runtime.mjs
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-runtime-${{ runner.os == 'macOS' && 'darwin-arm64' || 'linux-x64' }}
          path: ${{ runner.temp }}/sandbox-runtime
      - name: Unpack protected runtime
        run: |
          mkdir -p apps/server/resources/agent-sandbox/runtime
          tar -xzf "$RUNNER_TEMP/sandbox-runtime/sandbox-runtime.tgz" -C apps/server/resources/agent-sandbox/runtime

      - name: Verify the shipped engine uses protected execution
        env:
          LEGALWORK_SANDBOX_INTEGRATION: '1'
        run: |
          pnpm --filter legalwork-server build
          LEGALWORK_TEST_OPENCODE_BIN="$(command -v opencode)" bun test --preload ./apps/server/test-preload.ts --timeout 180000 apps/server/src/agent-sandbox/engine.integration.test.ts apps/server/src/opencode-plugins/legalwork-skill-resources.integration.test.ts
