# CI-only overlay. Local packaging continues to use electron-builder.yml.
extends: ./electron-builder.yml
forceCodeSigning: true
win:
  azureSignOptions:
    publisherName: Eigenwelt Labs UG (haftungsbeschränkt)
    endpoint: https://neu.codesigning.azure.net/
    codeSigningAccountName: eigenweltlabslegalwork
    certificateProfileName: legalwork
    fileDigest: SHA256
    timestampRfc3161: http://timestamp.acs.microsoft.com
    timestampDigest: SHA256
